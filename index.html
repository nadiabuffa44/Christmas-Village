<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noël à Paris</title>
<style>
:root{--ink:#26222e;--cream:#fbf3df;--rose:#c8553d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2733;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#e9e3d3}
#stage>svg,#stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}

#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 58%,rgba(46,28,52,.34) 100%)}
#grain{mix-blend-mode:multiply;opacity:.55;pointer-events:none}

/* ---------- animation ---------- */
.flick{animation:flick 4s infinite ease-in-out}
@keyframes flick{0%,100%{opacity:.04}8%{opacity:.34}14%{opacity:.1}30%{opacity:.52}45%{opacity:.16}60%{opacity:.42}78%{opacity:.08}90%{opacity:.3}}
.breathe{animation:breathe 5s infinite ease-in-out}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.tw{animation:tw 2.4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.puff{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 6s infinite ease-out}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx,20px),-62px) scale(1.25);opacity:0}}
.note{transform-box:fill-box;transform-origin:center;opacity:0;animation:note 5.5s infinite ease-out;font-size:22px;fill:#26222e}
@keyframes note{0%{transform:translate(0,0) rotate(-8deg);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,18px),-80px) rotate(14deg);opacity:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s infinite ease-in-out alternate}
@keyframes sway{from{transform:rotate(-2.2deg) translateX(-1px)}to{transform:rotate(2.2deg) translateX(2px)}}

/* ---------- entry gate ---------- */
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;
  background:rgba(40,28,52,.52);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:opacity 1.2s ease,visibility 1.2s}
#gate.gone{opacity:0;visibility:hidden}
#gate .card{background:var(--cream);padding:34px 46px 30px;border:3px solid var(--ink);border-radius:6px 22px 8px 20px;
  box-shadow:7px 8px 0 rgba(38,34,46,.85);max-width:min(90vw,440px);transform:rotate(-1deg)}
#gate h1{margin:0 0 4px;font-size:clamp(30px,6vw,46px);font-style:italic;letter-spacing:.5px}
#gate p{margin:0 0 22px;font-size:17px;opacity:.78}
#gate button{font:inherit;font-size:19px;font-style:italic;padding:11px 28px;background:var(--rose);color:var(--cream);
  border:3px solid var(--ink);border-radius:30px;cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:transform .15s}
#gate button:hover{transform:translateY(-2px) rotate(-1deg)}
#gate small{display:block;margin-top:16px;font-size:13px;opacity:.6}

/* ---------- controls ---------- */
#hud{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:6px;
  padding:7px 12px;background:rgba(251,243,223,.93);border:2.5px solid var(--ink);border-radius:30px;box-shadow:2px 3px 0 rgba(38,34,46,.8);
  transition:opacity .6s,transform .6s;max-width:94vw}
#hud.hide{opacity:0;transform:translateX(-50%) translateY(10px);pointer-events:none}
#hud button{font:inherit;font-size:16px;line-height:1;width:34px;height:34px;border:0;background:transparent;color:var(--ink);border-radius:50%;cursor:pointer}
#hud button:hover{background:rgba(200,85,61,.18)}
#hud input[type=range]{width:84px;accent-color:var(--rose)}
#now{font-style:italic;font-size:14px;padding:0 8px;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.idle{cursor:none}
@media (max-width:560px){#now{display:none}#hud input[type=range]{width:64px}}
</style>
</head>
<body>
<div id="stage" aria-label="A hand-drawn animated illustration of a snowy Paris square at Christmas">
  <svg id="bg"  viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <svg id="fx"  viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <svg id="pe"  viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <canvas id="sn" width="1600" height="900"></canvas>
  <svg id="grain" viewBox="0 0 100 100" preserveAspectRatio="none">
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .14  0 0 0 .5 -.13"/>
    </filter>
    <rect width="100" height="100" filter="url(#paper)"/>
  </svg>
  <div id="vignette"></div>
</div>

<div id="gate">
  <div class="card">
    <h1>Noël à Paris</h1>
    <p>A snowy evening on a little Paris square.</p>
    <button id="enter">Entrer ♪</button>
    <small>Sound on, please.</small>
  </div>
</div>

<div id="hud" class="hide" role="toolbar" aria-label="Music controls">
  <button id="bPlay" title="Pause / play (space)" aria-label="Pause or play">❚❚</button>
  <button id="bNext" title="Next (n)" aria-label="Next track">⏭</button>
  <button id="bMute" title="Mute (m)" aria-label="Mute">♪</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
  <span id="now"></span>
  <button id="bAdd" title="Play your own audio files" aria-label="Add audio files">＋</button>
  <input id="pick" type="file" accept="audio/*" multiple hidden>
  <button id="bFs" title="Full screen (f)" aria-label="Full screen">⛶</button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   MUSIC PLAYLIST
   Put royalty-free audio files in a "tracks" folder next to this page and
   list them here, in play order. artist and credit are optional (use credit
   for any attribution line the licence asks for; it shows on hover).
   ===================================================================== */
const TRACKS = [
  { title: 'Jingle Bells', artist: 'The Reed Pittman Trio', credit: 'Jingle Bells by The Reed Pittman Trio', src: 'jingle-bells.mp3' },
  { title: 'Silent Night', artist: 'The Reed Pittman Trio', credit: 'Silent Night by The Reed Pittman Trio', src: 'silent-night.mp3' },
  { title: 'We Wish You a Merry Christmas', artist: 'The Reed Pittman Trio', credit: 'We Wish You a Merry Christmas by The Reed Pittman Trio', src: 'we-wish-you-a-merry-christmas.mp3' },
  { title: 'O Little Town of Bethlehem', artist: 'The Reed Pittman Trio', credit: 'O Little Town of Bethlehem by The Reed Pittman Trio', src: 'o-little-town-of-bethlehem.mp3' },
  { title: 'God Rest Ye Merry Gentlemen', artist: 'The Reed Pittman Trio', credit: 'God Rest Ye Merry Gentlemen by The Reed Pittman Trio', src: 'god-rest-ye-merry-gentlemen.mp3' },
  { title: 'Auld Lang Syne', artist: 'The Reed Pittman Trio', credit: 'Auld Lang Syne by The Reed Pittman Trio', src: 'auld-lang-syne.mp3' },
];

/* ============================ helpers ============================== */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1224);
const rnd = (a, b) => a + R() * (b - a);
const pick = a => a[Math.floor(R() * a.length)];
const INK = '#26222e';
const W = 1600, H = 900, G = 612;               // canvas, street-level baseline
const LN = { stroke: INK, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
let ROUGH = 0;                                                    // set on while the people are drawn
const _rp = document.createElementNS(NS, 'path');
function roughD(d, amp) {                                         // re-draw a path as a wobbly, hand-held line
  _rp.setAttribute('d', d);
  let L; try { L = _rp.getTotalLength(); } catch (e) { return d; }
  if (!(L > 5)) return d;
  const closed = /[zZ]\s*$/.test(d.trim()), n = Math.max(5, Math.round(L / 6.5)), a = Math.min(amp * .8, L * .05);
  const k1 = rnd(.22, .45), k2 = rnd(.7, 1.3), p1 = rnd(0, 6.3), p2 = rnd(0, 6.3), pts = [];
  for (let i = 0; i <= n; i++) {
    const l = L * i / n, p = _rp.getPointAtLength(l), a0 = _rp.getPointAtLength(Math.max(0, l - 1.2)), a1 = _rp.getPointAtLength(Math.min(L, l + 1.2));
    let tx = a1.x - a0.x, ty = a1.y - a0.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const o = a * (Math.sin(l * k1 + p1) * .65 + Math.sin(l * k2 + p2) * .35);
    pts.push([p.x - ty * o, p.y + tx * o]);
  }
  if (closed) pts.pop();
  const N = pts.length, g = i => closed ? pts[(i + N) % N] : pts[Math.max(0, Math.min(N - 1, i))], f = v => v.toFixed(1);
  let out = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]);
  const segs = closed ? N : N - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    out += ' C' + f(p1[0] + (p2[0] - p0[0]) / 6) + ',' + f(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + f(p2[0] - (p3[0] - p1[0]) / 6) + ',' + f(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f(p2[0]) + ',' + f(p2[1]);
  }
  return out + (closed ? ' Z' : '');
}
function shapeToD(tag, at) {
  const f = k => parseFloat(at[k]);
  switch (tag) {
    case 'path': return [at.d, []];
    case 'circle': { const cx = f('cx'), cy = f('cy'), r = f('r'); return [`M${cx - r},${cy} a${r},${r} 0 1,0 ${2 * r},0 a${r},${r} 0 1,0 ${-2 * r},0 Z`, ['cx', 'cy', 'r']]; }
    case 'ellipse': { const cx = f('cx'), cy = f('cy'), rx = f('rx'), ry = f('ry'); return [`M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0 Z`, ['cx', 'cy', 'rx', 'ry']]; }
    case 'rect': {
      const x = f('x'), y = f('y'), w = f('width'), h = f('height'), r = Math.min(parseFloat(at.rx) || 0, w / 2, h / 2);
      const d = r > .5 ? `M${x + r},${y} h${w - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 ${-r},${r} h${-(w - 2 * r)} a${r},${r} 0 0 1 ${-r},${-r} v${-(h - 2 * r)} a${r},${r} 0 0 1 ${r},${-r} Z` : `M${x},${y} h${w} v${h} h${-w} Z`;
      return [d, ['x', 'y', 'width', 'height', 'rx', 'ry']];
    }
    case 'line': return [`M${f('x1')},${f('y1')} L${f('x2')},${f('y2')}`, ['x1', 'y1', 'x2', 'y2']];
    case 'polygon': return ['M' + at.points.trim().replace(/\s+/g, ' L') + ' Z', ['points']];
    case 'polyline': return ['M' + at.points.trim().replace(/\s+/g, ' L'), ['points']];
  }
  return null;
}
function lnRough(p, tag, at, a) {
  const conv = shapeToD(tag, at);
  if (!conv) return el(tag, at, p);
  const [d0, drop] = conv; drop.forEach(k => delete at[k]);
  const amp = at['stroke-width'] > 2 ? .95 : .7, d1 = roughD(d0, amp);
  if (at.fill && at.fill !== 'none' && at.stroke === INK) {       // hand-coloured: the wash sits a hair off the outline
    const w = { d: d1, fill: at.fill, stroke: 'none' };
    w.transform = (a.transform ? a.transform + ' ' : '') + `translate(${rnd(.8, 1.7).toFixed(2)} ${rnd(-1.5, -.5).toFixed(2)})`;
    el('path', w, p);
    at.fill = 'none';
  }
  const e = el('path', Object.assign({}, at, { d: d1 }), p);
  if (at.stroke === INK && at['stroke-width'] > 2.2) {
    el('path', Object.assign({}, at, { d: roughD(d0, amp * 1.15), fill: 'none', 'stroke-width': +(at['stroke-width'] * .5).toFixed(2), 'stroke-opacity': .55 }), p);
  }
  return e;
}
const ln = (p, tag, a) => {                                       // hand-inked shape: pressure + loose second pass
  const at = Object.assign({}, LN, a);
  at['stroke-width'] = +(at['stroke-width'] * rnd(.85, 1.25)).toFixed(2);
  if (ROUGH) return lnRough(p, tag, at, a);
  const e = el(tag, at, p);
  if (at.stroke === INK && at['stroke-width'] > 1.1) {
    const o = Object.assign({}, at, { fill: 'none', 'stroke-width': +(at['stroke-width'] * .5).toFixed(2), 'stroke-opacity': .62 });
    o.transform = (a.transform ? a.transform + ' ' : '') + `translate(${rnd(-1.8, 1.8).toFixed(2)} ${rnd(-1.8, 1.8).toFixed(2)})`;
    el(tag, o, p);
  }
  return e;
};
const nf = (p, tag, a) => el(tag, a, p);                          // plain shape

const shade = (hex, k) => {                                      // darken (k<0) or lighten (k>0) a #rrggbb colour
  const n = parseInt(hex.slice(1), 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.max(0, Math.min(255, Math.round(c * (1 + k)))).toString(16).padStart(2, '0')).join('');
};

/* ============================ layers =============================== */
const bg = $('#bg'), fx = $('#fx'), pe = $('#pe'), snc = $('#sn'), snx = snc.getContext('2d');

bg.innerHTML = `<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfd5d3"/><stop offset=".5" stop-color="#efe5d0"/><stop offset="1" stop-color="#f7e8cf"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="paint" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="4" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="11" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="1" seed="11" result="jit"/>
    <feDisplacementMap in="d1" in2="jit" scale="3.4" xChannelSelector="G" yChannelSelector="R" result="d2"/>
    <feColorMatrix in="d2" type="saturate" values=".74" result="d"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" result="grain"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .1  0 0 0 -.7 .4" result="speck"/>
    <feComposite in="speck" in2="d" operator="in" result="speckIn"/>
    <feMerge><feMergeNode in="d"/><feMergeNode in="speckIn"/></feMerge>
  </filter>
</defs>`;
fx.innerHTML = `<defs>
  <radialGradient id="glowG"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd37a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd37a" stop-opacity="0"/></linearGradient>
</defs>`;

const gSky   = el('g', {}, bg);
const gFar   = el('g', { filter: 'url(#paint)', opacity: .5 }, bg);
const gChurch= el('g', { filter: 'url(#paint)', opacity: .72 }, bg);
const gBack  = el('g', { filter: 'url(#paint)', opacity: .8 }, bg);
const gGround= el('g', { filter: 'url(#paint)' }, bg);
const gBld   = el('g', {}, bg);
const gLights= el('g', {}, bg);
const TS = .78, tx = x => 800 + (x - 800) * TS, ty = y => 700 + (y - 700) * TS;
const gTree  = el('g', { filter: 'url(#paint)', transform: `translate(800 700) scale(${TS}) translate(-800 -700)` }, bg);
const gLamps = el('g', { filter: 'url(#paint)' }, bg);
const gFront = el('g', { filter: 'url(#paint)' }, bg);

/* ============================== sky ================================ */
nf(gSky, 'rect', { width: W, height: H, fill: 'url(#skyG)' });
[[300,70,330,64,'#c3cfd6'],[1100,80,380,70,'#d6d3cf'],[760,330,520,80,'#f4d9bd'],[180,400,320,70,'#f1dcc2'],[1420,410,320,76,'#efd5bb'],[800,150,260,50,'#e8e3d6']].forEach(([x, y, rx, ry, c]) =>
  nf(gSky, 'ellipse', { cx: x, cy: y, rx, ry, fill: c, opacity: .75, filter: 'url(#soft)' }));

/* ============================ far Paris rooftops =================== */
(function () {
  let x = -30;
  while (x < W + 40) {
    const w = rnd(70, 120), h = rnd(130, 230), b = G - 12, rh = rnd(32, 46);
    nf(gFar, 'rect', { x, y: b - h, width: w, height: h + 20, fill: pick(['#cfc6c8', '#d8c9b8', '#c3cbd2', '#d3ccb4', '#dcc6c0']) });
    nf(gFar, 'polygon', { points: `${x-4},${b-h} ${x+14},${b-h-rh} ${x+w-14},${b-h-rh} ${x+w+4},${b-h}`, fill: '#9096aa' });
    for (let i = 0; i < 3; i++) if (R() < .75) nf(gFar, 'rect', { x: x + rnd(10, w - 18), y: b - h - rh - 14, width: 7, height: 16, fill: '#a68270' });
    for (let i = 0; i < 4; i++) if (R() < .6) nf(gFar, 'rect', { x: x + rnd(8, w - 18), y: b - h + rnd(16, h - 30), width: 8, height: 14, fill: '#f4d68a' });
    x += w - rnd(0, 10);
  }
})();

/* ============================== Eiffel Tower ======================= */
(function () {
  const cx = 800, base = G - 8, Ht = 500;
  const prof = [[0,.19],[.06,.15],[.12,.122],[.17,.106],[.23,.088],[.30,.07],[.35,.06],[.45,.045],[.58,.034],[.70,.026],[.84,.0185],[.92,.011],[1,.003]];
  const P = prof.map(([f, hw]) => [f, hw * Ht]);
  const Y = f => base - f * Ht;
  const L = P.map(([f, h]) => `${(cx - h).toFixed(1)},${Y(f).toFixed(1)}`);
  const Rr = P.map(([f, h]) => `${(cx + h).toFixed(1)},${Y(f).toFixed(1)}`);
  nf(gChurch, 'polygon', { points: [...L, ...Rr.slice().reverse()].join(' '), fill: '#b9b1c2', opacity: .55 });
  ln(gChurch, 'polyline', { points: L.join(' '), fill: 'none', 'stroke-width': 2.4 });
  ln(gChurch, 'polyline', { points: Rr.join(' '), fill: 'none', 'stroke-width': 2.4 });
  for (let i = 0; i < P.length - 1; i++) {
    const [f0, h0] = P[i], [f1, h1] = P[i + 1];
    ln(gChurch, 'line', { x1: cx - h0, y1: Y(f0), x2: cx + h1, y2: Y(f1), 'stroke-width': 1 });
    ln(gChurch, 'line', { x1: cx + h0, y1: Y(f0), x2: cx - h1, y2: Y(f1), 'stroke-width': 1 });
    ln(gChurch, 'line', { x1: cx - h1, y1: Y(f1), x2: cx + h1, y2: Y(f1), 'stroke-width': 1 });
  }
  [[.17, .106], [.35, .06], [.84, .0185]].forEach(([f, hw]) =>
    ln(gChurch, 'rect', { x: cx - hw * Ht - 9, y: Y(f) - 4, width: hw * Ht * 2 + 18, height: 8, fill: '#d8d0dc', 'stroke-width': 2.2 }));
  const a = .19 * Ht * .52;
  ln(gChurch, 'path', { d: `M${cx - a},${base} Q${cx},${base - .2 * Ht} ${cx + a},${base}`, fill: 'none', 'stroke-width': 2.4 });
  ln(gChurch, 'line', { x1: cx, y1: Y(1), x2: cx, y2: Y(1) - 26, 'stroke-width': 2 });
})();

/* ============================ bare trees =========================== */
function bareTree(parent, x, y, len, depth, spread, wBase, a0 = 0, snow = true) {
  const paths = Array.from({ length: depth + 1 }, () => []);
  (function rec(x, y, l, a, d) {
    const x2 = x + Math.sin(a) * l, y2 = y - Math.cos(a) * l;
    paths[depth - d].push(`M${x.toFixed(1)},${y.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`);
    if (d > 0) {
      const n = d >= depth - 1 ? 2 : (R() < .33 ? 3 : 2);
      for (let i = 0; i < n; i++) rec(x2, y2, l * rnd(.66, .8), a + (i - (n - 1) / 2) * rnd(.45, .8) * spread + rnd(-.15, .15), d - 1);
    }
  })(x, y, len, a0, depth);
  paths.forEach((p, i) => {
    const w = Math.max(1.1, wBase * Math.pow(.62, i));
    el('path', { d: p.join(' '), stroke: INK, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round' }, parent);
    if (snow && i >= 1 && i <= 3) el('path', { d: p.join(' '), stroke: '#fff', 'stroke-width': w * .5, fill: 'none', 'stroke-linecap': 'round', transform: 'translate(0,-1.6)', opacity: .92 }, parent);
  });
}
bareTree(gBack, 70, 600, 120, 7, 1, 11, .05);

const wins = [], smokes = [], bulbs = [], shops = [];
const STONE = '#efe5cf';

function hatch(p, x, y, w, h, gap, op) {                       // pen hatching for shade
  let d = '';
  for (let yy = y + w * .5; yy <= y + h + w * .5; yy += gap) d += `M${x.toFixed(1)},${(yy + rnd(-1, 1)).toFixed(1)} l${w.toFixed(1)},${(-w * .5 + rnd(-2, 2)).toFixed(1)} `;
  nf(p, 'path', { d, stroke: INK, 'stroke-width': 1, fill: 'none', opacity: op, 'stroke-linecap': 'round' });
}

function building(o, bi) {
  const { x, w, h } = o, top = G - h, rh = 78, roofTop = top - rh;
  const g = el('g', { filter: 'url(#paint)' }, gBld);
  const wash = el('g', { transform: 'translate(6,-5)' }, g);     // colour sits a little off the lines
  const mid = el('g', {}, g);

  /* facade, stone courses, shade */
  nf(wash, 'rect', { x, y: top, width: w, height: h + 8, fill: o.color });

  ln(mid, 'rect', { x, y: top, width: w, height: h, fill: 'none', 'stroke-width': 3 });
  hatch(mid, x + w - 30, top + 14, 28, h - 200, 7, .3);

  /* cornice with dentils */
  ln(mid, 'rect', { x: x - 5, y: top - 7, width: w + 10, height: 12, fill: STONE, 'stroke-width': 2.4 });
  { let d = ''; for (let dx = x + 5; dx < x + w - 2; dx += 11) d += `M${dx},${top + 5} v6 `; nf(mid, 'path', { d, stroke: INK, 'stroke-width': 1.5, fill: 'none' }); }

  /* zinc mansard roof */
  const pts = `${x-8},${top-5} ${x+w+8},${top-5} ${x+w-22},${roofTop} ${x+22},${roofTop}`;
  nf(wash, 'polygon', { points: pts, fill: o.roofColor });
  for (let yy = roofTop + 9; yy < top - 8; yy += 9) { const f = (top - 5 - yy) / (rh - 5); nf(mid, 'path', { d: `M${x - 8 + 30 * f},${yy} L${x + w + 8 - 30 * f},${yy}`, stroke: INK, 'stroke-width': 1, opacity: .22, fill: 'none' }); }
  ln(mid, 'polygon', { points: pts, fill: 'none', 'stroke-width': 3 });
  ln(mid, 'polyline', { points: `${x-2},${top-9} ${x+26},${roofTop+7}`, stroke: '#fff', 'stroke-width': 9, opacity: .97 });
  ln(mid, 'polyline', { points: `${x+w+2},${top-9} ${x+w-26},${roofTop+7}`, stroke: '#fff', 'stroke-width': 9, opacity: .97 });
  ln(mid, 'rect', { x: x + 16, y: roofTop - 9, width: w - 32, height: 11, rx: 4, fill: '#fff', 'stroke-width': 2.2 });

  /* dormers */
  const nd = w > 150 ? 2 : 1;

    nf(wash, 'polygon', { points: `${dx-20},${roofTop+27} ${dx},${roofTop+8} ${dx+20},${roofTop+27}`, fill: o.roofColor });
    ln(mid, 'rect', { x: dx - 15, y: roofTop + 26, width: 30, height: 32, fill: 'none', 'stroke-width': 2.2 });
    ln(mid, 'polygon', { points: `${dx-20},${roofTop+27} ${dx},${roofTop+8} ${dx+20},${roofTop+27}`, fill: 'none', 'stroke-width': 2.2 });

  /* a few icicles */
  for (let ix = x + 8; ix < x + w - 6; ix += rnd(24, 34)) ln(mid, 'polygon', { points: `${ix},${top+6} ${ix+6},${top+6} ${ix+3},${top+rnd(12,20)}`, fill: '#fff', 'stroke-width': 1.3 });

  /* tall French windows; the first-floor ones get pediments and one long iron balcony */
  const floors = Math.max(1, Math.floor((h - 172) / 76)), n = Math.max(2, Math.floor(w / 50)), grandF = Math.min(1, floors - 1);
  for (let f = 0; f < floors; f++) {
    const ww = 26, wh = 52, wy = top + 22 + f * 76, grand = f === grandF;
    for (let i = 0; i < n; i++) {
      const wx = x + (w / n) * (i + .5) - ww / 2;

  {
    const y = G - 158, segs = Math.max(3, Math.round(w / 36)), sp = (w - 16) / segs;

  /* signboard */
  {
    const sy = G - 136, name = o.shop.n, fs = Math.min(13, (w - 44) / (name.length * .84));

    const t = el('text', { x: x + w / 2, y: sy + 15, 'text-anchor': 'middle', 'font-size': fs, 'font-family': 'Georgia,serif', 'font-weight': 700, 'letter-spacing': 1.2, fill: '#e9cf84' }, mid);

  /* awning, shop window, door */
  {
    const ay = G - 112, ah = 16, ax = x + 8, aw = w - 16, ns = Math.max(4, Math.round(aw / 16)), sw = aw / ns;
    for (let i = 0; i < ns; i++) {

    ln(mid, 'rect', { x: px, y: py, width: pw, height: ph, fill: 'none', 'stroke-width': 2.6 });
    ln(mid, 'line', { x1: px + pw / 2, y1: py, x2: px + pw / 2, y2: py + ph, 'stroke-width': 1.6 });
    ln(mid, 'rect', { x: px - 3, y: py + ph, width: pw + 6, height: 6, rx: 2.5, fill: '#fff', 'stroke-width': 1.6 });
    shops.push({ x: px, y: py, w: pw, h: ph });
    wins.push({ shop: true, x: px + 2, y: py + 2, w: pw - 4, h: ph - 4 });

    wins.push({ x: dx + 6, y: G - dh + 9, w: dw - 12, h: 20 });
    shops[shops.length - 1].doorX = dx + dw / 2; shops[shops.length - 1].name = o.shop.n;
    ln(mid, 'circle', { cx: dx + dw / 2, cy: G - dh + 48, r: 8, fill: 'none', stroke: '#2f6f4f', 'stroke-width': 5 });
    nf(mid, 'circle', { cx: dx + dw / 2, cy: G - dh + 57, r: 3.2, fill: '#a8453a' });
    nf(mid, 'circle', { cx: dx + dw - 5, cy: G - 34, r: 2.2, fill: '#e0b043' });
  }

      pts.push([a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1], u]);
    }
    const topE = pts.map(([x, y, u]) => `${x.toFixed(1)},${(y - 5 * (1 - u * .5)).toFixed(1)}`);
    const bot = pts.map(([x, y, u], m) => `${(x + side * (m % 2 ? 5 : 0)).toFixed(1)},${(y + (11 * (1 - u * .75) + 3) + (m % 2 ? 9 : 2) * (1 - u * .5)).toFixed(1)}`);
    nf(gTree, 'polygon', { points: [...topE, ...bot.slice().reverse()].join(' '), fill: pick(DK) });
    const nd = [[], [], []];
    for (let m = 0; m < M * 3; m++) {
      const u = m / (M * 3), seg = Math.min(M - 1, Math.floor(u * M)), f = u * M - seg;
      const x = pts[seg][0] + (pts[seg + 1][0] - pts[seg][0]) * f, y = pts[seg][1] + (pts[seg + 1][1] - pts[seg][1]) * f;
      for (let q = 0; q < 2; q++) {

/* what a person is doing when they are not walking; each returns overrides for the pose */
const sm = x => x * x * (3 - 2 * x);
const ACT = {
  sip(t, ph) {
    const u = (t + ph * 1.3) % 8, k = u < .8 ? sm(u / .8) : u < 1.5 ? 1 : u < 2.3 ? 1 - sm((u - 1.5) / .8) : 0;
    return { nU: -30 - 14 * k, nF: -108 - 42 * k, head: -7 * k, item: 52 * k, breath: .15 };
  },
  read(t, ph) { return { head: 5 + 1.5 * Math.sin(t * .8 + ph), nU: -22 + Math.sin(t * 1.1 + ph), breath: .1 }; },
  talk(t, ph, c) {
    const spk = Math.floor((t + (c.off || 0)) / 4.4) % (c.n || 2) === (c.i || 0);
    if (spk) { const g1 = Math.sin(t * 3.1 + ph * 2), g2 = Math.sin(t * 2.3 + ph); return { fU: -38 + 26 * g1, fF: -62 - 32 * (g2 * .5 + .5), head: 3 * Math.sin(t * 4 + ph), mouth: 1 + Math.abs(Math.sin(t * 7 + ph)) * 2.2, breath: 1 }; }
    return { head: -2 + 2 * Math.sin(t * 1.2 + ph), breath: .25 };
  },
  point(t, ph) {
    const s = Math.sin(t * .6 + ph);
    if (s > .55) return { nU: -80 - 6 * Math.sin(t * 5), nF: -12, head: -4 };
    if (s < -.4) return { nU: -40, nF: -126, head: -3 };
    return { head: 0 };
  },
  paint(t, ph) {
    const dab = Math.sin(t * 2.6), away = Math.sin(t * .35 + ph) > .8;
    return { nU: -72 + 6 * dab, nF: -22 + (away ? 0 : 16 * Math.sin(t * 5.1)), fU: -28, fF: -96, head: away ? -4 : 3 * dab, lean: away ? -2 : 3 };
  },
  play(t, ph) { const sq = Math.sin(t * 1.9 + ph); return { nU: -38 - 5 * sq, nF: -84, fU: -36 + 5 * sq, fF: -90, head: 2 * Math.sin(t * 1.9), tap: Math.abs(Math.sin(t * 3.8)), lean: 1 + sq, breath: .5 }; },
  dance(t, ph) { const s = Math.sin(t * 4 + ph); return { nU: -50 + 30 * s, nF: -20, fU: -50 - 30 * s, fF: -20, bob: 3 * Math.abs(Math.sin(t * 4 + ph)), head: 4 * Math.sin(t * 2), tap: Math.max(0, s) * .6 }; },

    return {};

};

  const audio = new Audio(); audio.preload = 'auto';
  let fails = 0;
  const effVol = () => st.muted ? 0 : st.vol;
  function show() {
    const t = st.list[st.idx], n = $('#now');
    n.textContent = t ? '♪ ' + t.title + (t.artist ? ' — ' + t.artist : '') : 'No music yet — tap ＋ to try your own files';
    n.title = t ? (t.credit || n.textContent) : '';
  }
  function load(i, autoplay) {
    if (!st.list.length) { show(); return Promise.resolve(false); }
    st.idx = (i + st.list.length) % st.list.length;
    audio.src = st.list[st.idx].src; audio.volume = effVol(); show();
    return autoplay ? audio.play().then(() => true).catch(() => false) : Promise.resolve(true);
  }
  function next() { if (st.list.length) load(st.idx + 1, true); }
  audio.addEventListener('ended', () => { fails = 0; next(); });
  audio.addEventListener('playing', () => { fails = 0; });
  audio.addEventListener('play', () => { st.playing = true; $('#bPlay').textContent = '❚❚'; });
  audio.addEventListener('pause', () => { if (!audio.ended) { st.playing = false; $('#bPlay').textContent = '►'; } });
  audio.addEventListener('error', () => {
    if (++fails < st.list.length) next();
    else $('#now').textContent = 'Could not load the tracks — check the file names in tracks/';
  });
  return {
    state: st, next,
    start() { if (st.list.length) load(0, true); else { $('#bPlay').textContent = '►'; show(); } },
    toggle() { if (st.list.length) { audio.paused ? audio.play() : audio.pause(); } },
    setVol(v) { st.vol = v; audio.volume = effVol(); },
    toggleMute() { st.muted = !st.muted; audio.volume = effVol(); return st.muted; },
    add(files) {                                              // preview your own files without editing the page
      const added = [...files].filter(f => (f.type || '').startsWith('audio/') || /\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(f.name))
        .map(f => ({ title: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), src: URL.createObjectURL(f) }));
      if (!added.length) return;
      const first = st.list.length;
      st.list.push(...added);
      if (!audio.src || audio.paused) load(first, true); else show();
    }
  };
})();

/* ============================ UI wiring ============================ */
const gate = $('#gate'), hud = $('#hud'), bPlay = $('#bPlay'), bMute = $('#bMute'), vol = $('#vol'), pick_ = $('#pick');
$('#gate small').textContent = TRACKS.length ? 'Sound on, please.' : 'Sound on, please. (Music files not added yet.)';
if (TRACKS.length) $('#bAdd').remove();
$('#enter').addEventListener('click', () => { gate.classList.add('gone'); hud.classList.remove('hide'); Music.start(); armIdle(); });
bPlay.addEventListener('click', () => Music.toggle());
$('#bNext').addEventListener('click', () => Music.next());
bMute.addEventListener('click', () => { bMute.style.opacity = Music.toggleMute() ? .4 : 1; bMute.textContent = Music.state.muted ? '✕' : '♪'; });
vol.addEventListener('input', () => Music.setVol(+vol.value));
if ($('#bAdd')) $('#bAdd').addEventListener('click', () => pick_.click());
pick_.addEventListener('change', () => { Music.add(pick_.files); pick_.value = ''; });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) Music.add(e.dataTransfer.files); });
const fs = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
$('#bFs').addEventListener('click', fs);
addEventListener('keydown', e => {
  if (!gate.classList.contains('gone')) return;
  if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
  else if (e.key === 'm') bMute.click(); else if (e.key === 'n') Music.next(); else if (e.key === 'f') fs();
});
let idleT;
function armIdle() {
  const wake = () => { hud.classList.remove('hide'); document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { hud.classList.add('hide'); document.body.classList.add('idle'); }, 3800); };
  ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();
}
})();
</script>
</body>
