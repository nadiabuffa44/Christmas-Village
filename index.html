<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noël · Natale</title>
<style>
:root{--ink:#26222e;--cream:#fbf3df;--rose:#c8553d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2733;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none;background:#2a2733}
.scene.on{opacity:1}
/* ---------- entry gate ---------- */
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;
  background:rgba(40,28,52,.52);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:opacity 1.2s ease,visibility 1.2s}
#gate.gone{opacity:0;visibility:hidden}
#gate .card{background:var(--cream);padding:34px 46px 30px;border:3px solid var(--ink);border-radius:6px 22px 8px 20px;
  box-shadow:7px 8px 0 rgba(38,34,46,.85);max-width:min(90vw,440px);transform:rotate(-1deg)}
#gate h1{margin:0 0 4px;font-size:clamp(30px,6vw,46px);font-style:italic;letter-spacing:.5px}
#gate p{margin:0 0 22px;font-size:17px;opacity:.78}
#gate button{font:inherit;font-size:19px;font-style:italic;padding:11px 28px;background:var(--rose);color:var(--cream);
  border:3px solid var(--ink);border-radius:30px;cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:transform .15s}
#gate button:hover{transform:translateY(-2px) rotate(-1deg)}
#gate small{display:block;margin-top:16px;font-size:13px;opacity:.6}

/* ---------- controls ---------- */
#hud{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:6px;
  padding:7px 12px;background:rgba(251,243,223,.93);border:2.5px solid var(--ink);border-radius:30px;box-shadow:2px 3px 0 rgba(38,34,46,.8);
  transition:opacity .6s,transform .6s;max-width:94vw}
#hud.hide{opacity:0;transform:translateX(-50%) translateY(10px);pointer-events:none}
#hud button{font:inherit;font-size:16px;line-height:1;width:34px;height:34px;border:0;background:transparent;color:var(--ink);border-radius:50%;cursor:pointer}
#hud button:hover{background:rgba(200,85,61,.18)}
#hud input[type=range]{width:84px;accent-color:var(--rose)}
#now{font-style:italic;font-size:14px;padding:0 8px;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.idle{cursor:none}
@media (max-width:560px){#now{display:none}#hud input[type=range]{width:64px}}

#scenes{display:flex;gap:2px;padding:0 4px 0 2px;border-right:2px solid rgba(38,34,46,.25);margin-right:2px}
#hud #scenes button{width:auto;height:30px;padding:0 11px;border-radius:16px;font-size:14px;font-style:italic}
#hud #scenes button.act{background:var(--rose);color:var(--cream)}
#gate .pick{display:flex;gap:10px;justify-content:center;margin:0 0 20px}
#gate .pick button{font-size:15px;padding:7px 16px;background:transparent;color:var(--ink);box-shadow:none}
#gate .pick button.act{background:var(--cream);box-shadow:2px 3px 0 var(--ink);font-weight:700}
</style>
</head>
<body>
<div id="stageHost"></div>

<div id="gate">
  <div class="card">
    <h1 id="gTitle">Noël à Paris</h1>
    <p id="gSub">A snowy evening on a little Paris square.</p>
    <div class="pick" id="gPick"></div>
    <button id="enter">Entrer ♪</button>
    <small>Sound on, please.</small>
  </div>
</div>

<div id="hud" class="hide" role="toolbar" aria-label="Music and scene controls">
  <div id="scenes" role="group" aria-label="Scene"></div>
  <button id="bPlay" title="Pause / play (space)" aria-label="Pause or play">❚❚</button>
  <button id="bNext" title="Next (n)" aria-label="Next track">⏭</button>
  <button id="bMute" title="Mute (m)" aria-label="Mute">♪</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
  <span id="now"></span>
  <button id="bFs" title="Full screen (f)" aria-label="Full screen">⛶</button>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TRACK_BASE = '';                                     // music files sit next to this page
const TRACKS = [
  ['Jingle Bells', 'jingle-bells.mp3'], ['Silent Night', 'silent-night.mp3'], ['We Wish You a Merry Christmas', 'we-wish-you-a-merry-christmas.mp3'],
  ['O Little Town of Bethlehem', 'o-little-town-of-bethlehem.mp3'], ['God Rest Ye Merry Gentlemen', 'god-rest-ye-merry-gentlemen.mp3'], ['Auld Lang Syne', 'auld-lang-syne.mp3'],
].map(([title, f]) => ({ title, artist: 'The Reed Pittman Trio', credit: title + ' by The Reed Pittman Trio', src: TRACK_BASE + f }));

/* ------------------------------ scenes ------------------------------ */
const SCENES = [
  { id: 'paris',  name: 'Paris',  src: 'paris.html',  title: 'Noël à Paris',      sub: 'A snowy evening on a little Paris square.',        btn: 'Entrer ♪' },
  { id: 'italy',  name: 'Italy',  src: 'italy.html'  , title: 'Buon Natale',       sub: 'The Christmas market in front of the Duomo, Milan.',   btn: 'Entra ♪' },
  { id: 'swiss',  name: 'Swiss Alps', src: 'swiss.html', title: 'Joyeux Noël', sub: 'Dusk at a Christmas market on the shores of a Swiss lake.', btn: 'Entrer ♪' },
];
let cur = null, saved = null;
try { saved = localStorage.getItem('village-scene'); } catch (e) {}
const host = $('#stageHost');
function labels(id) {
  const sc = SCENES.find(s => s.id === id);
  $('#gTitle').textContent = sc.title; $('#gSub').textContent = sc.sub; $('#enter').textContent = sc.btn;
  document.title = sc.title;
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('act', b.dataset.scene === id));
}
function show(id) {
  if (id === cur) return;
  const sc = SCENES.find(s => s.id === id); if (!sc) return;
  const old = host.querySelector('.scene.on, .scene');
  const fr = document.createElement('iframe');
  fr.className = 'scene'; fr.src = sc.src; fr.title = sc.title; fr.setAttribute('tabindex', '-1');
  fr.addEventListener('load', () => {
    requestAnimationFrame(() => { fr.classList.add('on'); });
    document.querySelectorAll('.scene').forEach(f => { if (f !== fr) { f.classList.remove('on'); setTimeout(() => f.remove(), 1300); } });
  });
  host.appendChild(fr);
  cur = id; labels(id);
  try { localStorage.setItem('village-scene', id); } catch (e) {}
}
SCENES.forEach(sc => {
  ['#scenes', '#gPick'].forEach(sel => {
    const b = document.createElement('button'); b.textContent = sc.name; b.dataset.scene = sc.id; b.addEventListener('click', () => show(sc.id)); $(sel).appendChild(b);
  });
});
show(SCENES.some(s => s.id === saved) ? saved : 'paris');

/* ------------------------------ music ------------------------------- */
const Music = (() => {
  const st = { playing: false, muted: false, vol: .7, idx: 0, list: TRACKS.slice() };
  const audio = new Audio(); audio.preload = 'auto';
  let fails = 0;
  const effVol = () => st.muted ? 0 : st.vol;
  function showNow() { const t = st.list[st.idx], n = $('#now'); n.textContent = t ? '♪ ' + t.title + ' — ' + t.artist : ''; n.title = t ? t.credit : ''; }
  function load(i, autoplay) {
    st.idx = (i + st.list.length) % st.list.length;
    audio.src = st.list[st.idx].src; audio.volume = effVol(); showNow();
    return autoplay ? audio.play().then(() => true).catch(() => false) : Promise.resolve(true);
  }
  function next() { load(st.idx + 1, true); }
  audio.addEventListener('ended', () => { fails = 0; next(); });
  audio.addEventListener('playing', () => { fails = 0; });
  audio.addEventListener('play', () => { st.playing = true; $('#bPlay').textContent = '❚❚'; });
  audio.addEventListener('pause', () => { if (!audio.ended) { st.playing = false; $('#bPlay').textContent = '►'; } });
  audio.addEventListener('error', () => { if (++fails < st.list.length) next(); else $('#now').textContent = 'Could not load the music files'; });
  return {
    state: st, next,
    start() { load(0, true); },
    toggle() { audio.paused ? audio.play() : audio.pause(); },
    setVol(v) { st.vol = v; audio.volume = effVol(); },
    toggleMute() { st.muted = !st.muted; audio.volume = effVol(); return st.muted; },
  };
})();

/* --------------------------- controls ------------------------------- */
const gate = $('#gate'), hud = $('#hud'), bPlay = $('#bPlay'), bMute = $('#bMute'), vol = $('#vol');
$('#enter').addEventListener('click', () => { gate.classList.add('gone'); hud.classList.remove('hide'); Music.start(); armIdle(); });
bPlay.addEventListener('click', () => Music.toggle());
$('#bNext').addEventListener('click', () => Music.next());
bMute.addEventListener('click', () => { bMute.style.opacity = Music.toggleMute() ? .4 : 1; bMute.textContent = Music.state.muted ? '✕' : '♪'; });
vol.addEventListener('input', () => Music.setVol(+vol.value));
const fs = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
$('#bFs').addEventListener('click', fs);
addEventListener('keydown', e => {
  if (!gate.classList.contains('gone')) return;
  if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
  else if (e.key === 'm') bMute.click(); else if (e.key === 'n') Music.next(); else if (e.key === 'f') fs();
  else if (e.key === 's') show(SCENES[(SCENES.findIndex(s => s.id === cur) + 1) % SCENES.length].id);
});
let idleT;
function armIdle() {
  const wake = () => { hud.classList.remove('hide'); document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { hud.classList.add('hide'); document.body.classList.add('idle'); }, 3800); };
  ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();
}
})();
</script>
</body>
</html>
